<!DOCTYPE html>
<html lang="ru">
<head>

<title>Asper X · YOUR TOP SONGS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#1a1a1a;color:#e0e0e0;font-family:'Segoe UI',Arial,sans-serif;display:flex;align-items:center;justify-content:center}
#app{max-width:600px;width:100%;margin:auto;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}

.logo{text-align:center;margin-bottom:15px}
.logo .main{font-size:42px;font-weight:700;letter-spacing:4px;background:linear-gradient(135deg,#ffffff,#aaaaaa,#dddddd,#ffffff,#bbbbbb,#eeeeee,#ffffff);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 8s ease-in-out infinite;line-height:1.2}
.logo .main .big-letter{font-size:52px;display:inline-block;line-height:1}
.logo .sub{font-size:16px;font-weight:300;letter-spacing:6px;color:#bbb;margin-top:4px}
@keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.btn-start{background:linear-gradient(135deg,#8b0000,#cc0000);color:#fff;font-size:18px;font-weight:700;letter-spacing:3px;padding:18px;margin:10px 0 25px 0;border:none;border-radius:8px;width:100%;cursor:pointer;transition:all 0.3s ease;text-transform:uppercase;box-shadow:0 4px 25px rgba(139,0,0,0.4)}
.btn-start:hover{background:linear-gradient(135deg,#cc0000,#ff1a1a);box-shadow:0 4px 35px rgba(139,0,0,0.6);transform:translateY(-2px)}

.btn-secondary{background:transparent;border:1px solid #444;color:#aaa;padding:14px;border-radius:8px;width:100%;cursor:pointer;font-size:15px;transition:all 0.3s ease;margin-top:10px}
.btn-secondary:hover{border-color:#8b0000;color:#8b0000;background:rgba(139,0,0,0.1)}

.btn-continue{background:linear-gradient(135deg,#cc8800,#eebb00);color:#1a1a1a;font-size:16px;font-weight:700;letter-spacing:2px;padding:14px;border:none;border-radius:8px;width:100%;cursor:pointer;transition:all 0.3s ease;text-transform:uppercase;box-shadow:0 4px 25px rgba(204,136,0,0.3)}
.btn-continue:hover{background:linear-gradient(135deg,#eebb00,#ffcc33);box-shadow:0 4px 35px rgba(204,136,0,0.5);transform:translateY(-2px)}

.btn-rank-warning{background:transparent;border:1px solid #444;color:#aaa;padding:14px;border-radius:8px;width:100%;cursor:pointer;font-size:15px;letter-spacing:2px;transition:all 0.3s ease;margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.btn-rank-warning:hover{border-color:#8b0000;color:#8b0000;background:rgba(139,0,0,0.1)}
.btn-rank-warning .sub-text{font-size:11px;letter-spacing:1px;color:#666;font-weight:300}

.info-grid{display:grid;grid-template-columns:1fr;gap:8px;margin:20px 0;width:100%}
.info-item{background:#1f1f1f;padding:14px 18px;border-radius:8px;border:1px solid #333;display:flex;align-items:center;gap:14px;transition:all 0.3s ease}
.info-item:hover{border-color:#555;background:#262626}
.info-item .icon{font-size:22px;min-width:36px;text-align:center}
.info-item .text{flex:1}
.info-item .text .main{color:#eee;font-weight:500;font-size:15px}
.info-item .text .desc{color:#aaa;font-size:13px;margin-top:2px}

.footer{text-align:center;color:#666;font-size:13px;margin-top:30px;padding-top:20px;border-top:1px solid #2a2a2a;letter-spacing:1px;width:100%}
.footer .heart{color:#ff0044}
.footer .author{color:#888;font-size:13px;margin-top:5px;letter-spacing:1px;display:flex;justify-content:center;gap:12px;align-items:center}
.footer .author a{color:#999;text-decoration:none;transition:all 0.3s ease;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;background:#1a1a1a;border:1px solid #333}
.footer .author a:hover{color:#8b0000;border-color:#8b0000;transform:scale(1.05)}
.footer .version{color:#333;font-size:11px;font-weight:300;letter-spacing:2px;margin-top:6px;font-family:monospace}

.progress-container{display:none;background:#1f1f1f;padding:15px 20px;border-radius:8px;margin-bottom:20px;border:1px solid #333;width:100%}
.progress-container.show{display:block}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.progress-top .label{color:#aaa;font-size:13px;letter-spacing:1px}
.progress-top .percent{color:#cc0000;font-weight:700;font-size:16px}
.progress-bar{width:100%;height:4px;background:#333;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#8b0000,#cc0000);transition:width 0.5s ease;border-radius:2px}

.song-card{background:#1f1f1f;padding:15px 20px;border-radius:12px;margin:10px 0;text-align:center;border:1px solid #333;width:100%;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.song-card .title{font-size:20px;font-weight:600;color:#fff;height:60px;display:flex;align-items:center;justify-content:center;line-height:1.3;word-break:break-word;padding:0 5px}
.song-card .title.small{font-size:17px}
.song-card .title.xsmall{font-size:14px}

.btn-group{display:flex;gap:8px;justify-content:center;width:100%}
.btn-group button{flex:1;min-width:0;height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:600;cursor:pointer;transition:all 0.3s ease}
.vote-btn{background:linear-gradient(135deg,#8b0000,#cc0000);color:#fff;border:none;font-size:15px;padding:0 10px;white-space:nowrap;box-shadow:0 4px 15px rgba(139,0,0,0.3)}
.vote-btn:hover{background:linear-gradient(135deg,#cc0000,#ff1a1a);box-shadow:0 4px 25px rgba(139,0,0,0.5);transform:translateY(-1px)}

.fav-btn{background:transparent;border:1px solid #444;color:#888;font-size:20px;padding:0 8px}
.fav-btn:hover{border-color:#8b0000;color:#8b0000;transform:scale(1.05)}
.fav-btn.active{color:#ff0044;border-color:#ff0044;background:rgba(255,0,68,0.15);animation:heartPulse 2s ease-in-out infinite}
.fav-btn.active:hover{background:rgba(255,0,68,0.25);transform:scale(1.1)}

.skip-btn{background:transparent;border:1px solid #333;color:#666;font-size:14px;padding:0 8px}
.skip-btn:hover{border-color:#8b0000;color:#8b0000;background:rgba(139,0,0,0.08)}
.skip-btn.disabled{opacity:0.3;cursor:not-allowed;pointer-events:none}

.ranking-list{width:100%}
.rank-item{padding:5px 0;display:flex;align-items:center;gap:8px}
.rank-item .pos{color:#666;font-weight:300;min-width:30px;font-size:15px}
.rank-item .name{color:#eee;font-weight:400;font-size:15px}
.rank-item .fav{color:#ff0044;margin-left:auto;font-size:14px}

.skipped-section{margin-top:10px;padding-top:8px;border-top:1px solid #2a2a2a;width:100%}
.skipped-section h3{color:#555;font-weight:300;text-align:center;font-size:13px;letter-spacing:2px;margin-bottom:4px}
.skipped-item{color:#555;font-size:13px;padding:3px 8px;background:#151515;border-radius:4px;margin:2px 0;display:flex;justify-content:space-between}

.warning-box{background:#2a1a1a;border:2px solid #8b0000;border-radius:12px;padding:15px 20px;margin:10px 0 15px 0;text-align:center;width:100%}
.warning-box .title{color:#ff4444;font-weight:700;font-size:18px;margin-bottom:6px}
.warning-box .text{color:#ff8888;font-size:15px;margin-bottom:8px;line-height:1.4}
.warning-box .subtext{color:#ff8888;font-size:14px;margin-bottom:12px}
.warning-box .btn-continue{max-width:300px;margin:0 auto}

.success-box{background:#1a2a1a;border:2px solid #4aa54a;border-radius:12px;padding:12px 15px;margin:10px 0 15px 0;text-align:center;width:100%}
.success-box .title{color:#4aa54a;font-weight:700;font-size:16px}
.success-box .text{color:#88dd88;font-size:14px}

@keyframes heartPulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.08)}
}

@media(max-width:480px){#app{padding:10px}.logo .main{font-size:32px}.logo .main .big-letter{font-size:40px}.logo .sub{font-size:14px;letter-spacing:4px}.song-card .title{font-size:17px;height:50px}.song-card .title.small{font-size:14px}.song-card .title.xsmall{font-size:12px}.btn-group button{height:38px;font-size:13px}.fav-btn,.skip-btn{font-size:16px}.info-item{padding:10px 12px}.info-item .text .main{font-size:13px}.footer .author{flex-wrap:wrap}.footer .version{font-size:10px}}
</style>

</head>

<body>

<div id="app"></div>

<script>

const VERSION = "1.0.5";

const SONGS=[
    "Bad Trip", "Monsta", "Plague (feat. Ctrl+Freak)", "Sorry Not Sorry", "Stellar",
    "Über Ich", "Будет больно", "Был таким всегда (feat. aikko)", "В долгий путь",
    "Вместе", "Ветер перемен", "Всё разбито (feat. KASKAD, Совергон, VULPES VULT!, ПАНЦУШОТ, Танцы Сознания)",
    "Всё, что должно умереть", "Выстрели", "Волчок", "Делать", "Дело нескольких минут",
    "Демоны города Икс", "Держись", "Дрянь", "Дыхание", "Дышать и жить", "Заряжай",
    "Засыпай", "Земля", "Звёздная", "Змея", "Имя", "Ищи", "Если зовут",
    "Каждый справляется сам", "Каприз", "Карантинка", "Картонная", "Квадрат Декарта",
    "Классики (feat. tamagotchik)", "Колыбельная", "Космос", "Крики планет",
    "Курит и молчит (feat. Ar4ey)", "Лабиринт (feat. ЛИСН)", "Линии жизни",
    "Локус генома", "Любить", "Любовь и ненависть на улице Ленина", "Мой бог",
    "Море", "Мотыльки (feat. Port Avenue)", "Мы не железные", "Надо улыбаться",
    "Не выходи", "Не переживай", "Не люблю", "Незнакомка", "Никому не говори",
    "От автора", "Патрон", "Пей, лечись, люби (feat. Гарри Топор)", "Перелом",
    "Петь в тишине", "Питер Пэйн", "План", "Почти получилось", "Праздничная",
    "Право успеть", "Прикосноверие", "Приходи ко мне (feat. МОНТГОМЕРИ)",
    "Привидения", "Приметы (feat. ГОТЭМ)", "Прозерпина", "Просто поговорить",
    "Прости (feat. VULPES VULT!)", "ПТСР (feat. Ctrl+Freak)",
    "Пускай весь мир разлетается по кускам", "Пустота (feat. Ctrl+Freak)",
    "Радость", "Самая честная песня", "Сгораю", "Сказка (feat. Катя Лу)",
    "Скоро узнаешь", "Слёзы сквозь смех", "Смерть луны",
    "Сумасшедшим вход бесплатно", "Ты будешь гореть в аду", "Удачи, мистер Горски",
    "Универсальный солдат", "Улетай", "Шаг назад (feat. UNVRS)",
    "Шизофрения (feat. Серафим)", "Шрам", "Чтобы не забыть (feat. МОЛОДОСТЬ ВНУТРИ)",
    "Эдем", "Эпитафия (feat. DEEP-EX-SENSE, Лжедмитрий IV)",
    "Я буду любить тебя вечно", "Я рассыпаю сахар", "Ядовитые"
]

let state={
    songs:[],
    a:null,
    b:null,
    history:[],
    compared:[],
    voteHistory:[]
};
let ratings = {};
let cachedProgress = 0;

function save(){localStorage.setItem("asper_x",JSON.stringify(state));}

function load(){
let x=localStorage.getItem("asper_x");
if(x){
try{
let parsed=JSON.parse(x);
if(parsed.songs&&parsed.songs.length>0){
parsed.songs=parsed.songs.map(s=>({...s,favorite:s.favorite||false,skipped:s.skipped||false,wins:s.wins||0,losses:s.losses||0,played:s.played||0,elo:s.elo||1000,preview:s.preview||""}));
parsed.compared=parsed.compared||[];
parsed.voteHistory=parsed.voteHistory||[];
state=parsed;
return true;
}}catch(e){}
}
return false;
}

function init(){
state.songs=SONGS.map((x,i)=>({id:i,title:x,preview:"",elo:1000,wins:0,losses:0,favorite:false,skipped:false,played:0}));
state.history=[];
state.compared=[];
state.voteHistory=[];
state.a=null;
state.b=null;
ratings = {};
cachedProgress = 0;
save();
}

function isCompared(id1,id2){
if(id1>id2){let t=id1;id1=id2;id2=t;}
return state.compared.some(p=>p.a===id1&&p.b===id2);
}

function addCompared(id1,id2,winner){
if(id1>id2){let t=id1;id1=id2;id2=t;}
state.compared.push({a:id1,b:id2,winner:winner});
}

function allSongsHaveWin(){
let active=state.songs.filter(s=>!s.skipped);
let zeroWins=active.filter(s=>s.wins===0);
if(zeroWins.length>1){
return false;
}
return true;
}

function allSongsPlayed(){
let active=state.songs.filter(s=>!s.skipped);
for(let s of active){
if(s.played<3){
return false;
}
}
return true;
}

function getMinComparisons(song){
let base=3;
if(song.elo>1100)return 8;
if(song.elo>1050)return 6;
if(song.elo>950)return 5;
return base;
}

function getK(song){
let sorted=[...state.songs.filter(s=>!s.skipped)].sort((a,b)=>b.elo-a.elo);
let position=sorted.findIndex(s=>s.id===song.id)+1;
let k=32;
if(position<=10){k=16;}
else if(position<=20){k=24;}
else if(position<=50){k=32;}
else{k=40;}
if(song.played>10){k=k*0.8;}
if(song.played>20){k=k*0.7;}
if(song.favorite&&position<=20){k=k*0.85;}
return Math.round(k);
}

function isFavComplete(){
let active=state.songs.filter(s=>!s.skipped);
let sorted=[...active].sort((a,b)=>b.elo-a.elo);
let songsWithFav=active.filter(s=>s.favorite);
let songsWithoutFav=active.filter(s=>!s.favorite);
for(let noFav of songsWithoutFav){
let noFavIndex=sorted.indexOf(noFav);
let highestFav=null;
let highestFavIndex=Infinity;
for(let withFav of songsWithFav){
let idx=sorted.indexOf(withFav);
if(idx<highestFavIndex){
highestFavIndex=idx;
highestFav=withFav;
}
}
if(noFavIndex < highestFavIndex){
if(highestFavIndex - noFavIndex > 1){
return false;
}
if(!isCompared(noFav.id, highestFav.id)){
return false;
}
}
}
return true;
}

function isTopComplete(){
let active=state.songs.filter(s=>!s.skipped);
let sorted=[...active].sort((a,b)=>b.elo-a.elo);
let top5=sorted.slice(0,5);
let top10=sorted.slice(0,10);
let top20=sorted.slice(0,20);
for(let i=0;i<top5.length;i++){
for(let j=i+1;j<top5.length;j++){
if(!isCompared(top5[i].id,top5[j].id)){
return false;
}
}
}
for(let i=0;i<top10.length;i++){
for(let j=i+1;j<top10.length;j++){
if(!isCompared(top10[i].id,top10[j].id)){
return false;
}
}
}
for(let song of top20){
if(song.played<7){
return false;
}
}
for(let i=0;i<top20.length-1;i++){
if(!isCompared(top20[i].id,top20[i+1].id)){
if(Math.abs(top20[i].elo-top20[i+1].elo)<100){
return false;
}
}
}
for(let song of top10){
let minMatches=song.elo>1150?10:8;
if(song.played<minMatches){
return false;
}
}
return true;
}

function isComplete(){
let active=state.songs.filter(s=>!s.skipped);
if(active.length<2)return true;
if(!allSongsHaveWin()){
return false;
}
for(let s of active){
if(s.played<getMinComparisons(s)){
return false;
}
}
if(!isFavComplete()){
return false;
}
if(!isTopComplete()){
return false;
}
return true;
}

function getProgress(){
if(isComplete()){
cachedProgress=100;
return 100;
}
let active=state.songs.filter(s=>!s.skipped);
if(active.length<2){
cachedProgress=100;
return 100;
}
let needed=active.length*3;
let done=state.compared.length;
let progress=Math.min(99,Math.round((done/needed)*100));
if(progress>cachedProgress){
cachedProgress=progress;
}
return cachedProgress;
}

function saveVoteState(){
let snapshot={
a:state.a?{...state.a}:null,
b:state.b?{...state.b}:null,
songs:state.songs.map(s=>({
id:s.id,
elo:s.elo,
wins:s.wins,
losses:s.losses,
played:s.played,
favorite:s.favorite,
skipped:s.skipped
})),
lastCompared:state.compared.length>0?{...state.compared[state.compared.length-1]}:null
};
state.voteHistory.push(snapshot);
if(state.voteHistory.length>10){
state.voteHistory.shift();
}
save();
}

function showToast(message){
let toast=document.createElement('div');
toast.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:1000;opacity:0;transition:opacity 0.3s ease;max-width:90%;text-align:center;';
toast.textContent=message;
document.body.appendChild(toast);
setTimeout(()=>{toast.style.opacity='1';},10);
setTimeout(()=>{
toast.style.opacity='0';
setTimeout(()=>toast.remove(),300);
},2000);
}

function undoVote(){
if(state.voteHistory.length===0){
showToast('❌ Нет действий для отмены');
return;
}
let prev=state.voteHistory.pop();
state.a=prev.a;
state.b=prev.b;
for(let savedSong of prev.songs){
let currentSong=state.songs.find(s=>s.id===savedSong.id);
if(currentSong){
currentSong.elo=savedSong.elo;
currentSong.wins=savedSong.wins;
currentSong.losses=savedSong.losses;
currentSong.played=savedSong.played;
}
}
if(prev.lastCompared){
state.compared.pop();
}
for(let song of state.songs){
if(!song.skipped){
ratings[song.title]=song.elo;
}
}
save();
showToast('↩️ Отменено последнее действие');
render();
}

function elo(winner,loser){
let kw=getK(winner);
let kl=getK(loser);
let ew=1/(1+Math.pow(10,(loser.elo-winner.elo)/400));
let el=1/(1+Math.pow(10,(winner.elo-loser.elo)/400));
let oldWinnerElo=winner.elo;
let oldLoserElo=loser.elo;
winner.elo=Math.round(winner.elo+kw*(1-ew));
loser.elo=Math.round(loser.elo+kl*(0-el));
let winnerDiff=winner.elo-oldWinnerElo;
let loserDiff=loser.elo-oldLoserElo;
if(Math.abs(winnerDiff)>50){
winner.elo=oldWinnerElo+(winnerDiff>0?50:-50);
}
if(Math.abs(loserDiff)>50){
loser.elo=oldLoserElo+(loserDiff>0?50:-50);
}
let eloDiff=Math.abs(winner.elo-loser.elo);
if(eloDiff<50&&winner.played>5&&loser.played>5){
let reduction=0.5+(eloDiff/100);
winner.elo=Math.round(oldWinnerElo+(winner.elo-oldWinnerElo)*reduction);
loser.elo=Math.round(oldLoserElo+(loser.elo-oldLoserElo)*reduction);
}
}

function findPair(){
let active=state.songs.filter(s=>!s.skipped);
let sorted=[...active].sort((a,b)=>b.elo-a.elo);
let top5=sorted.slice(0,5);
let top10=sorted.slice(0,10);
let top20=sorted.slice(0,20);

let zeroWins=active.filter(s=>s.wins===0);
if(zeroWins.length>1){
for(let i=0;i<zeroWins.length;i++){
for(let j=i+1;j<zeroWins.length;j++){
if(!isCompared(zeroWins[i].id,zeroWins[j].id)){
state.a=zeroWins[i];
state.b=zeroWins[j];
return true;
}
}
}
}

if(!allSongsPlayed()){
let shuffled=[...active].sort(()=>Math.random()-0.5);
for(let s of shuffled){
if(s.played<3){
let opponents=active.filter(x=>x.id!==s.id);
let shuffledOpps=[...opponents].sort(()=>Math.random()-0.5);
for(let opp of shuffledOpps){
if(!isCompared(s.id,opp.id)){
state.a=s;
state.b=opp;
return true;
}
}
}
}
}

let eloGroups={};
for(let s of active){
let eloKey=Math.round(s.elo/5)*5;
if(!eloGroups[eloKey]) eloGroups[eloKey]=[];
eloGroups[eloKey].push(s);
}
for(let key in eloGroups){
let group=eloGroups[key];
if(group.length>=2){
for(let i=0;i<group.length;i++){
for(let j=i+1;j<group.length;j++){
if(!isCompared(group[i].id,group[j].id)){
state.a=group[i];
state.b=group[j];
return true;
}
}
}
}
}

let songsWithFav=active.filter(s=>s.favorite);
let songsWithoutFav=active.filter(s=>!s.favorite);
for(let noFav of songsWithoutFav){
for(let withFav of songsWithFav){
if(noFav.elo>withFav.elo&&!isCompared(noFav.id,withFav.id)){
state.a=noFav;
state.b=withFav;
return true;
}
}
}

for(let i=0;i<top20.length-1;i++){
if(!isCompared(top20[i].id,top20[i+1].id)){
state.a=top20[i];
state.b=top20[i+1];
return true;
}
}

for(let i=0;i<top10.length;i++){
for(let j=i+1;j<top10.length;j++){
if(!isCompared(top10[i].id,top10[j].id)){
state.a=top10[i];
state.b=top10[j];
return true;
}
}
}

for(let i=0;i<top5.length;i++){
for(let j=i+1;j<top5.length;j++){
if(!isCompared(top5[i].id,top5[j].id)){
state.a=top5[i];
state.b=top5[j];
return true;
}
}
}

return false;
}

function pair(){
let active=state.songs.filter(s=>!s.skipped);
if(active.length<2){showComplete();return;}
let found=findPair();
if(!found){showComplete();return;}
save();
render();
}

function vote(x){
saveVoteState();
let w=x==="a"?state.a:state.b;
let l=x==="a"?state.b:state.a;
elo(w,l);
w.wins++;
l.losses++;
w.played++;
l.played++;
addCompared(state.a.id,state.b.id,w.id);
state.history.push({a:state.a.id,b:state.b.id,winner:w.id,time:Date.now()});
ratings[w.title]=w.elo;
ratings[l.title]=l.elo;
save();
pair();
}

function fav(x){
let s=x==="a"?state.a:state.b;
s.favorite=!s.favorite;
save();
render();
}

function skip(x){
let s=x==="a"?state.a:state.b;
if(s.favorite)return;
s.skipped=true;
state.compared=state.compared.filter(p=>p.a!==s.id&&p.b!==s.id);
if(state.a&&state.a.id===s.id)state.a=null;
if(state.b&&state.b.id===s.id)state.b=null;
save();
pair();
}
