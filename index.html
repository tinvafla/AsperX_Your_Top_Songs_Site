<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Asper X · YOUR TOP SONGS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#1a1a1a;color:#e0e0e0;font-family:'Segoe UI',Arial,sans-serif;display:flex;align-items:center;justify-content:center}
#app{max-width:600px;width:100%;margin:auto;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}

.logo{text-align:center;margin-bottom:20px}
.logo .main{font-size:48px;font-weight:700;letter-spacing:4px;background:linear-gradient(135deg,#ffffff,#aaaaaa,#dddddd,#ffffff,#bbbbbb,#eeeeee,#ffffff);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 8s ease-in-out infinite;line-height:1.2}
.logo .main .big-letter{font-size:60px;display:inline-block;line-height:1}
.logo .sub{font-size:18px;font-weight:300;letter-spacing:6px;color:#bbb;margin-top:4px}
@keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.btn-start{background:linear-gradient(135deg,#8b0000,#cc0000);color:#fff;font-size:18px;font-weight:700;letter-spacing:3px;padding:18px;margin:10px 0 25px 0;border:none;border-radius:8px;width:100%;cursor:pointer;transition:all 0.3s ease;text-transform:uppercase;box-shadow:0 4px 25px rgba(139,0,0,0.4)}
.btn-start:hover{background:linear-gradient(135deg,#cc0000,#ff1a1a);box-shadow:0 4px 35px rgba(139,0,0,0.6);transform:translateY(-2px)}

.btn-secondary{background:transparent;border:1px solid #444;color:#aaa;padding:14px;border-radius:8px;width:100%;cursor:pointer;font-size:15px;transition:all 0.3s ease;margin-top:10px}
.btn-secondary:hover{border-color:#8b0000;color:#8b0000;background:rgba(139,0,0,0.1)}

.btn-rank{background:transparent;border:1px solid #444;color:#aaa;padding:14px;border-radius:8px;width:100%;cursor:pointer;font-size:15px;letter-spacing:2px;transition:all 0.3s ease;margin-top:10px}
.btn-rank:hover{border-color:#8b0000;color:#8b0000;background:rgba(139,0,0,0.1)}

.btn-rank-warning{background:transparent;border:1px solid #444;color:#aaa;padding:14px;border-radius:8px;width:100%;cursor:pointer;font-size:15px;letter-spacing:2px;transition:all 0.3s ease;margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.btn-rank-warning:hover{border-color:#8b0000;color:#8b0000;background:rgba(139,0,0,0.1)}
.btn-rank-warning .sub-text{font-size:11px;letter-spacing:1px;color:#666;font-weight:300}

.info-grid{display:grid;grid-template-columns:1fr;gap:8px;margin:20px 0;width:100%}
.info-item{background:#1f1f1f;padding:14px 18px;border-radius:8px;border:1px solid #333;display:flex;align-items:center;gap:14px;transition:all 0.3s ease}
.info-item:hover{border-color:#555;background:#262626}
.info-item .icon{font-size:22px;min-width:36px;text-align:center}
.info-item .text{flex:1}
.info-item .text .main{color:#eee;font-weight:500;font-size:15px}
.info-item .text .desc{color:#aaa;font-size:13px;margin-top:2px}

.footer{text-align:center;color:#666;font-size:13px;margin-top:30px;padding-top:20px;border-top:1px solid #2a2a2a;letter-spacing:1px;width:100%}
.footer .heart{color:#ff0044}
.footer .author{color:#888;font-size:13px;margin-top:5px;letter-spacing:1px;display:flex;justify-content:center;gap:12px;align-items:center}
.footer .author a{color:#999;text-decoration:none;transition:all 0.3s ease;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;background:#1a1a1a;border:1px solid #333}
.footer .author a:hover{color:#8b0000;border-color:#8b0000;transform:scale(1.05)}

.progress-container{display:none;background:#1f1f1f;padding:15px 20px;border-radius:8px;margin-bottom:20px;border:1px solid #333;width:100%}
.progress-container.show{display:block}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.progress-top .label{color:#aaa;font-size:13px;letter-spacing:1px}
.progress-top .percent{color:#cc0000;font-weight:700;font-size:16px}
.progress-bar{width:100%;height:4px;background:#333;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#8b0000,#cc0000);transition:width 0.5s ease;border-radius:2px}

.song-card{background:#1f1f1f;padding:15px 20px;border-radius:12px;margin:10px 0;text-align:center;border:1px solid #333;width:100%;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.song-card .title{font-size:20px;font-weight:600;color:#fff;height:60px;display:flex;align-items:center;justify-content:center;line-height:1.3;word-break:break-word;padding:0 5px}
.song-card .title.small{font-size:17px}
.song-card .title.xsmall{font-size:14px}

.btn-group{display:flex;gap:8px;justify-content:center;width:100%}
.btn-group button{flex:1;min-width:0;height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:600;cursor:pointer;transition:all 0.3s ease}
.vote-btn{background:linear-gradient(135deg,#8b0000,#cc0000);color:#fff;border:none;font-size:15px;padding:0 10px;white-space:nowrap;box-shadow:0 4px 15px rgba(139,0,0,0.3)}
.vote-btn:hover{background:linear-gradient(135deg,#cc0000,#ff1a1a);box-shadow:0 4px 25px rgba(139,0,0,0.5);transform:translateY(-1px)}

.fav-btn{background:transparent;border:1px solid #444;color:#888;font-size:20px;padding:0 8px}
.fav-btn:hover{border-color:#8b0000;color:#8b0000;transform:scale(1.05)}
.fav-btn.active{color:#ff0044;border-color:#ff0044;background:rgba(255,0,68,0.15);text-shadow:0 0 30px rgba(255,0,68,0.4);animation:heartPulse 1.5s ease-in-out infinite}
.fav-btn.active:hover{background:rgba(255,0,68,0.25);transform:scale(1.1)}

.skip-btn{background:transparent;border:1px solid #333;color:#666;font-size:14px;padding:0 8px}
.skip-btn:hover{border-color:#8b0000;color:#8b0000;background:rgba(139,0,0,0.08)}
.skip-btn.disabled{opacity:0.3;cursor:not-allowed;pointer-events:none}

.ranking-list{width:100%}
.rank-item{padding:5px 0;display:flex;align-items:center;gap:8px}
.rank-item .pos{color:#666;font-weight:300;min-width:30px;font-size:15px}
.rank-item .name{color:#eee;font-weight:400;font-size:15px}
.rank-item .fav{color:#ff0044;margin-left:auto;font-size:14px}

.skipped-section{margin-top:10px;padding-top:8px;border-top:1px solid #2a2a2a;width:100%}
.skipped-section h3{color:#555;font-weight:300;text-align:center;font-size:13px;letter-spacing:2px;margin-bottom:4px}
.skipped-item{color:#555;font-size:13px;padding:3px 8px;background:#151515;border-radius:4px;margin:2px 0;display:flex;justify-content:space-between}

@keyframes heartPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

@media(max-width:480px){#app{padding:10px}.logo .main{font-size:32px}.logo .main .big-letter{font-size:40px}.logo .sub{font-size:14px;letter-spacing:4px}.song-card .title{font-size:17px;height:50px}.song-card .title.small{font-size:14px}.song-card .title.xsmall{font-size:12px}.btn-group button{height:38px;font-size:13px}.fav-btn,.skip-btn{font-size:16px}.info-item{padding:10px 12px}.info-item .text .main{font-size:13px}.footer .author{flex-wrap:wrap}}
</style>

</head>

<body>

<div id="app"></div>

<script>

const SONGS=[
 "Bad Trip", "Monsta", "Plague", "Sorry Not Sorry", "Über Ich",
    "Будет больно", "Был таким всегда", "В долгий путь", "Вместе",
    "Ветер перемен (2 раунд 17 независимый баттл)", "Волчок",
    "Всё разбито", "Всё, что должно умереть", "Выстрели",
    "Дело нескольких минут", "Демоны города Икс", "Держись",
    "Дрянь", "Дыхание", "Дышать и жить", "Жить", "Заряжай",
    "Земля", "Звёздная", "Змея", "Игра", "Имя", "Ищи",
    "Каждый справляется сам", "Каприз", "Карантинка",
    "Картонная", "Квадрат Декарта",
    "Классики (feat. tamagotchik)", "Колыбельная",
    "Космос", "Крики планет", "Курит и молчит",
    "Лабиринт (feat. ЛИСН)", "Линии жизни",
    "Локус генома", "Любовь и ненависть на улице Ленина",
    "Мой Бог", "Море", "Мотыльки (feat. Port Avenue)",
    "Мы не железные", "Надо улыбаться", "Не люблю",
    "Не выходи", "Не переживай", "Никому не говори",
    "От автора", "Патрон", "Пей, лечись, люби (feat. Гарри Топор)",
    "Перелом", "Петь в тишине", "Питер Пэйн",
    "План", "Почти получилось", "Праздничная",
    "Прикосновение", "Приходи ко мне (feat. МОНТГОМЕРИ)",
    "Привидения", "Прозерпина", "Приметы (feat. ГОТЭМ)",
    "Просто поговорить", "Прости (feat. VULPES VULT!)",
    "ПТСР (feat. Ctrl+Freak)", "Пускай весь мир разлетается по кускам",
    "Пустота (feat. Ctrl+Freak)", "Радость",
    "Самая честная песня", "Сгораю", "Сказка",
    "Скоро узнаешь", "Слёзы сквозь смех", "Смерть луны",
    "Сумасшедшим вход бесплатно", "Ты будешь гореть в аду",
    "Универсальный солдат", "Улетай",
    "Шаг назад (feat. UNVRS)", "Шизофрения (feat. Серафим)",
    "Шрам", "Чтобы не забыть (feat. МОЛОДОСТЬ ВНУТРИ)",
    "Эдем", "Эпитафия (feat. СИНЕРГИС)",
    "Я буду любить тебя вечно", "Ядовитые", "Я рассыпаю сахар"
]

let state={songs:[],a:null,b:null,history:[],compared:[]};
let ratings = {};

function save(){localStorage.setItem("asper_x",JSON.stringify(state));}

function load(){
let x=localStorage.getItem("asper_x");
if(x){
try{
let parsed=JSON.parse(x);
if(parsed.songs&&parsed.songs.length>0){
parsed.songs=parsed.songs.map(s=>({...s,favorite:s.favorite||false,skipped:s.skipped||false,wins:s.wins||0,losses:s.losses||0,played:s.played||0,elo:s.elo||1000,preview:s.preview||""}));
parsed.compared=parsed.compared||[];
state=parsed;
return true;
}}catch(e){}
}
return false;
}

function init(){
state.songs=SONGS.map((x,i)=>({id:i,title:x,preview:"",elo:1000,wins:0,losses:0,favorite:false,skipped:false,played:0}));
state.history=[];
state.compared=[];
state.a=null;
state.b=null;
ratings = {};
save();
}

function isCompared(id1,id2){
if(id1>id2){let t=id1;id1=id2;id2=t;}
return state.compared.some(p=>p.a===id1&&p.b===id2);
}

function addCompared(id1,id2,winner){
if(id1>id2){let t=id1;id1=id2;id2=t;}
state.compared.push({a:id1,b:id2,winner:winner});
}

function getMinComparisons(song){
return song.wins>0?5:3;
}

function isComplete(){
let active=state.songs.filter(s=>!s.skipped);
if(active.length<2)return true;
for(let s of active){
if(s.played<getMinComparisons(s))return false;
}
return true;
}

function getProgress(){
let active=state.songs.filter(s=>!s.skipped);
let needed=0;
for(let s of active){
needed+=getMinComparisons(s);
}
needed=Math.ceil(needed/2);
let done=state.compared.length;
let progress=Math.min(99,Math.round((done/needed)*100));
return progress;
}

function home(){
init();
app.innerHTML=`
<div class="logo">
<div class="main">
<span class="big-letter">A</span>SPER <span class="big-letter">X</span>
</div>
<div class="sub">YOUR TOP SONGS</div>
</div>
<button class="btn-start" onclick="start()">▶ НАЧАТЬ</button>
<div class="info-grid">
<div class="info-item">
<div class="icon">🎯</div>
<div class="text">
<div class="main">Выбери лучшую песню</div>
<div class="desc">Из двух предложенных</div>
</div>
</div>
<div class="info-item">
<div class="icon">❤️</div>
<div class="text">
<div class="main">В избранное</div>
<div class="desc">Отметь любимые треки</div>
</div>
</div>
<div class="info-item">
<div class="icon">⏭️</div>
<div class="text">
<div class="main">Пропустить</div>
<div class="desc">Не учитывается в топе</div>
</div>
</div>
</div>
<div class="footer">
<div>Сделано с <span class="heart">❤️</span> для Asper X и фандома</div>
<div class="author">
<a href="https://t.me/AsperX_Your_Top_Songs_bot" target="_blank">✈️ tinvafla</a>
</div>
</div>
`;
}

function start(){
if(!state.songs.length)init();
let active=state.songs.filter(s=>!s.skipped);
if(active.length<2){showComplete();return;}
if(isComplete()){showComplete();return;}
pair();
}

function showComplete(){
app.innerHTML=`
<div style="text-align:center;padding:40px 20px;">
<div style="font-size:64px;margin-bottom:20px;">🎯</div>
<div class="logo"><div class="main" style="font-size:32px;"><span class="big-letter">A</span>SPER <span class="big-letter">X</span></div></div>
<p style="color:#aaa;margin-bottom:30px;font-size:16px;">Твой топ готов!</p>
<button class="btn-start" onclick="ranking()" style="max-width:400px;margin:0 auto;">🏆 Рейтинг</button>
<button class="btn-secondary" onclick="resetAll()" style="max-width:400px;margin:10px auto 0 auto;">🔄 Начать заново</button>
<div class="footer" style="margin-top:30px;">
<div>Сделано с <span class="heart">❤️</span> для Asper X и фандома</div>
<div class="author">
<a href="https://t.me/AsperX_Your_Top_Songs_bot" target="_blank">✈️ tinvafla</a>
</div>
</div>
</div>
`;
}

function pair(){
let active=state.songs.filter(s=>!s.skipped);
if(active.length<2){showComplete();return;}
if(isComplete()){showComplete();return;}

let zeros = active.filter(s => s.wins === 0);
if (zeros.length > 1) {
    zeros.sort((a, b) => a.played - b.played);
    state.a = zeros[0];
    let opponents = active.filter(s => s.id !== state.a.id);
    opponents.sort((a, b) => {
        let aZ = a.wins === 0 ? 0 : 1;
        let bZ = b.wins === 0 ? 0 : 1;
        return aZ - bZ;
    });
    state.b = opponents[0];
    save();
    render();
    return;
}

active.sort((a,b)=>a.played-b.played);

let found=false;
for(let i=0;i<active.length&&!found;i++){
let a=active[i];
let opponents=active.filter(s=>s.id!==a.id&&!isCompared(a.id,s.id));
if(opponents.length>0){
state.a=a;
opponents.sort((x,y)=>x.played-y.played);
state.b=opponents[0];
found=true;
}
}

if(!found){
active.sort((a,b)=>a.played-b.played);
state.a=active[0];
let opponents=active.filter(s=>s.id!==state.a.id);
opponents.sort((a,b)=>a.played-b.played);
state.b=opponents[0];
}

if(state.a&&state.b&&state.a.id===state.b.id){
showComplete();
return;
}

save();
render();
}

function render(){
if(!state.a||!state.b){home();return;}

let progress=getProgress();

let favA=state.a.favorite?'active':'';
let favB=state.b.favorite?'active':'';
let skipA=state.a.favorite?'disabled':'';
let skipB=state.b.favorite?'disabled':'';

function getTitleClass(title){
if(title.length > 30) return 'xsmall';
if(title.length > 20) return 'small';
return '';
}

app.innerHTML=`
<div class="logo" style="margin-bottom:8px;">
<div class="main" style="font-size:22px;letter-spacing:2px;"><span class="big-letter" style="font-size:28px;">A</span>SPER <span class="big-letter" style="font-size:28px;">X</span></div>
<div class="sub" style="font-size:13px;letter-spacing:3px;">YOUR TOP SONGS</div>
</div>

<div class="progress-container show">
<div class="progress-top">
<span class="label">Оценка</span>
<span class="percent">${progress}%</span>
</div>
<div class="progress-bar">
<div class="progress-fill" style="width:${progress}%"></div>
</div>
</div>

<div class="song-card">
<div class="title ${getTitleClass(state.a.title)}">${state.a.title}</div>
<div class="btn-group">
<button class="vote-btn" onclick="vote('a')">Выбрать</button>
<button class="fav-btn ${favA}" onclick="fav('a')">❤</button>
<button class="skip-btn ${skipA}" onclick="skip('a')">⏭</button>
</div>
</div>

<h2 style="text-align:center;font-size:15px;font-weight:300;color:#666;margin:4px 0;letter-spacing:2px;">— ИЛИ —</h2>

<div class="song-card">
<div class="title ${getTitleClass(state.b.title)}">${state.b.title}</div>
<div class="btn-group">
<button class="vote-btn" onclick="vote('b')">Выбрать</button>
<button class="fav-btn ${favB}" onclick="fav('b')">❤</button>
<button class="skip-btn ${skipB}" onclick="skip('b')">⏭</button>
</div>
</div>

<button class="btn-rank-warning" onclick="ranking()">
<span>🏆 Рейтинг</span>
<span class="sub-text">⚠️ Досрочное завершение может привести к неточности результатов. Пожалуйста, не учитывайте такие результаты в общем рейтинге.</span>
</button>
`;
}

function expected(a,b){return 1/(1+Math.pow(10,(b.elo-a.elo)/400));}

function elo(w,l){
let k=32;
let ew=expected(w,l);
let el=expected(l,w);
w.elo=Math.round(w.elo+k*(1-ew));
l.elo=Math.round(l.elo+k*(0-el));
}

function vote(x){
let w=x==="a"?state.a:state.b;
let l=x==="a"?state.b:state.a;

elo(w,l);
w.wins++;
l.losses++;
w.played++;
l.played++;

addCompared(state.a.id,state.b.id,w.id);
state.history.push({a:state.a.id,b:state.b.id,winner:w.id,time:Date.now()});

ratings[w.title] = w.elo;
ratings[l.title] = l.elo;

save();
if(isComplete()){showComplete();}else{pair();}
}

function fav(x){
let s=x==="a"?state.a:state.b;
s.favorite=!s.favorite;
save();
render();
}

function skip(x){
let s=x==="a"?state.a:state.b;
if(s.favorite)return;
s.skipped=true;
state.compared=state.compared.filter(p=>p.a!==s.id&&p.b!==s.id);
if(state.a&&state.a.id===s.id)state.a=null;
if(state.b&&state.b.id===s.id)state.b=null;
save();
if(isComplete()){showComplete();}else{pair();}
}

function ranking(){
let list=[...state.songs].filter(s=>!s.skipped).sort((a,b)=>b.elo-a.elo);
let skipped=state.songs.filter(s=>s.skipped);

list.forEach(s => { ratings[s.title] = s.elo; });

const isFullComplete = isComplete();

app.innerHTML=`
<div class="logo" style="margin-bottom:8px;">
<div class="main" style="font-size:22px;letter-spacing:2px;"><span class="big-letter" style="font-size:28px;">A</span>SPER <span class="big-letter" style="font-size:28px;">X</span></div>
<div class="sub" style="font-size:13px;letter-spacing:3px;">YOUR TOP SONGS</div>
</div>
<div style="margin:8px 0;text-align:center;color:#aaa;font-size:13px;">Твой персональный рейтинг</div>
<div class="ranking-list">
${list.map((x,i)=>`

<span class="pos">${i+1}.</span>
<span class="name">${x.title}</span>
${x.favorite?'<span class="fav">♥</span>':''}
</div>
`).join('')}
</div>
${skipped.length>0?`
<div class="skipped-section">
<h3>— ПРОПУЩЕННЫЕ —</h3>
${skipped.map(x=>`
<div class="skipped-item">
<span>${x.title}</span>${x.favorite?'<span style="color:#ff0044;">♥</span>':''}
</div>
`).join('')}
</div>
`:''}

${!isFullComplete ? `
<div style="background:#2a1a1a;border:2px solid #8b0000;border-radius:12px;padding:15px;margin:15px 0;text-align:center;width:100%;">
<div style="color:#ff4444;font-weight:700;font-size:16px;margin-bottom:8px;">⚠️ ВНИМАНИЕ!</div>
<div style="color:#ff8888;font-size:14px;margin-bottom:10px;">
Вы завершили тест ДОСРОЧНО!<br>
Результат НЕДОСТОВЕРНЫЙ — не все песни были оценены.
</div>
<div style="color:#ff8888;font-size:13px;margin-bottom:15px;">

function continueTest() {
    // Возвращаемся к сравнению
    if(state.a && state.b) {
        render();
    } else {
        start();
    }
}

function resetAll(){
if(confirm('Удалить все данные и начать заново?')){
init();
home();
}
}

function sendResultsAndExit(event) {
    event.preventDefault();
    
    // Проверяем, пройден ли тест полностью
    if (!isComplete()) {
        alert('⚠️ Тест не пройден полностью! Результаты не будут сохранены.\nПройдите тест до конца.');
        return;
    }
    
    const sorted = Object.entries(ratings).sort((a,b) => b[1] - a[1]);
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user_id') || 'telegram_user_id';
    
    fetch('https://asperx-your-top-songs-bot.onrender.com/save_results', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            user_id: userId,
            top_90: sorted,
            is_complete: true
        })
    })
    .then(() => {
        window.location.href = 'tg://resolve?domain=AsperX_Your_Top_Songs_bot';
    })
    .catch(() => {
        window.location.href = 'tg://resolve?domain=AsperX_Your_Top_Songs_bot';
    });
}

init();
home();
